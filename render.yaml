# Blueprint do Render (https://render.com) - deploy automatizado.
#
# Como usar: suba este repositório pro GitHub, entre no Render, escolha
# "New +" -> "Blueprint", aponte pro repositório. O Render lê este
# arquivo e cria o serviço web + o banco Postgres já conectados.
#
# Se o Render mudou o formato do Blueprint desde que isto foi escrito
# (verifique a documentação atual em render.com/docs/blueprint-spec),
# configure manualmente pelo painel usando os mesmos valores abaixo -
# veja DEPLOY.md para o passo a passo manual completo.

databases:
  - name: atlas-db
    plan: free
    databaseName: atlas
    user: atlas

services:
  - type: web
    name: atlas
    runtime: python
    plan: free
    # "playwright install chromium" baixa só o BINÁRIO do Chromium (sem
    # --with-deps) porque o plano "free"/runtime "python" do Render não dá
    # acesso a root/apt-get durante o build - "--with-deps" tentaria rodar
    # apt-get e quebraria o build inteiro.
    #
    # PLAYWRIGHT_BROWSERS_PATH=0 (nos envVars abaixo) é o que faz esse
    # Chromium baixado realmente sobreviver até a hora de rodar (não só até
    # o fim do build): sem essa variável, o Playwright baixa o navegador em
    # ~/.cache/ms-playwright, uma pasta de cache do "build" que o Render
    # não carrega pro container que efetivamente roda o serviço depois -
    # o build "via bem" (o log mostra o download 100% concluído), mas o
    # Chromium some assim que o serviço sobe, e o botão "Gerar MBR" (tela
    # Auditoria) falha com "Executable doesn't exist". Com valor "0", o
    # Playwright instala o navegador DENTRO da própria pasta de instalação
    # do pacote (site-packages/.venv), que faz parte do que o Render
    # preserva do build pro deploy - resolve o problema na raiz.
    buildCommand: "pip install -r backend/requirements.txt -r backend/requirements-cloud.txt && playwright install chromium"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: ATLAS_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
