# Blueprint do Render (https://render.com) - deploy automatizado.
#
# Como usar: suba este repositório pro GitHub, entre no Render, escolha
# "New +" -> "Blueprint", aponte pro repositório. O Render lê este
# arquivo e cria o serviço web + o banco Postgres já conectados.
#
# Se o Render mudou o formato do Blueprint desde que isto foi escrito
# (verifique a documentação atual em render.com/docs/blueprint-spec),
# configure manualmente pelo painel usando os mesmos valores abaixo -
# veja DEPLOY.md para o passo a passo manual completo.

databases:
  - name: atlas-db
    # 07/10/2026: o banco já tinha sido promovido pro plano pago "0.1c-256mb"
    # ($6/mês) pelo painel do Render, sem este arquivo ser atualizado junto -
    # isso fazia o Render recusar TODO "Sync" automático do Blueprint
    # (gatilho de cada push) com o erro "cannot downgrade database from
    # 0.1c-256mb to Free", porque o Blueprint tentava reverter pro plano
    # Free gratuito sempre que sincronizava. Esse erro de Sync é separado do
    # deploy do serviço web em si (o deploy do código continua acontecendo
    # por fora do Blueprint, via auto-deploy do GitHub) - mas deixava a aba
    # "Syncs" do Render sempre vermelha. Corrigido apontando aqui pro plano
    # real já em uso, em vez de reintroduzir o drift toda vez que esse
    # arquivo for lido de novo.
    plan: 0.1c-256mb
    databaseName: atlas
    user: atlas

services:
  - type: web
    name: atlas
    runtime: python
    plan: free
    # O MBR (Monthly Business Review, gerado em Auditoria > Gerar MBR) foi
    # reescrito em 20/08/2026 para ler os dados direto das funções de
    # negócio do Atlas (sem navegador nenhum) - por isso o buildCommand não
    # precisa mais de "playwright install chromium" nem do
    # PLAYWRIGHT_BROWSERS_PATH abaixo (a versão anterior usava Playwright/
    # Chromium para printar as telas, o que trazia todo um histórico de
    # problemas de infraestrutura no plano "free": binário que não
    # persistia do build pro deploy, timeout de captura, estouro de
    # memória - ver ATUALIZANDO.md). Build volta a ser só "pip install".
    buildCommand: "pip install -r backend/requirements.txt -r backend/requirements-cloud.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: ATLAS_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3
